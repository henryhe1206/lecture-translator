<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="课堂翻译">
<title>课堂实时翻译</title>
<meta name="theme-color" content="#f2f2f7">
<link rel="stylesheet" href="style.css?v=7">
</head>
<body>
<header>
  <button id="btn-record" class="primary">开始听课</button>
  <button id="btn-summary">课堂总结</button>
  <button id="btn-new">新课</button>
  <button id="btn-history">历史</button>
  <button id="btn-handouts">讲义</button>
  <button id="btn-settings">设置</button>
  <label class="chk"><input type="checkbox" id="chk-en" checked> 英文</label>
  <label class="chk"><input type="checkbox" id="chk-review"> 回看</label>
</header>
<div id="session-title"></div>

<div id="sub-list"></div>
<div id="interim"></div>

<dialog id="dlg-settings">
  <form method="dialog">
    <h3>设置</h3>
    <label>Claude API Key<input type="password" id="set-key" autocomplete="off"></label>
    <label>翻译模型<input type="text" id="set-translate-model"></label>
    <label>总结 / 讲义要点模型<input type="text" id="set-summary-model"></label>
    <label>识别语言<input type="text" id="set-lang"></label>
    <p class="hint">Key 只保存在这台设备的浏览器本地。</p>
    <menu>
      <button id="btn-save" value="save">保存</button>
      <button value="cancel">取消</button>
    </menu>
  </form>
</dialog>

<dialog id="dlg-handouts">
  <h3>讲义</h3>
  <p class="hint">上传上课会用到的 PDF。只有勾选的讲义会参与翻译和总结，上哪门课就勾选哪门。</p>
  <label class="file-btn">上传 PDF（可多选）<input type="file" id="file-pdf" accept="application/pdf" multiple hidden></label>
  <ul id="doc-list"></ul>
  <menu><button id="btn-handouts-close">关闭</button></menu>
</dialog>

<dialog id="dlg-history">
  <h3>历史课程</h3>
  <ul id="session-list"></ul>
  <menu><button id="btn-history-close">关闭</button></menu>
</dialog>

<dialog id="dlg-summary">
  <h3 id="summary-title">课堂总结</h3>
  <div id="summary-body"></div>
  <menu>
    <button id="btn-summary-copy">复制</button>
    <button id="btn-summary-redo">重新生成</button>
    <button id="btn-summary-close">关闭</button>
  </menu>
</dialog>

<div id="status"></div>
<script type="module" src="app.js?v=7"></script>
</body>
</html>
